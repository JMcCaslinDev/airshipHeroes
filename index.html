<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airship Skirmish</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    canvas {
      display: block;
    }
    
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
    }
    
    #inventory {
      display: flex;
      gap: 5px;
    }
    
    .inventory-slot {
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.5);
      border: 2px solid #fff;
      border-radius: 5px;
    }
    
    .inventory-slot.active {
      border-color: #ffcc00;
    }
    
    #mode-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      border-radius: 5px;
    }
    
    #stats {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div id="inventory">
      <div class="inventory-slot active" data-slot="1"></div>
      <div class="inventory-slot" data-slot="2"></div>
      <div class="inventory-slot" data-slot="3"></div>
      <div class="inventory-slot" data-slot="4"></div>
      <div class="inventory-slot" data-slot="5"></div>
      <div class="inventory-slot" data-slot="6"></div>
      <div class="inventory-slot" data-slot="7"></div>
      <div class="inventory-slot" data-slot="8"></div>
      <div class="inventory-slot" data-slot="9"></div>
    </div>
  </div>
  
  <div id="mode-indicator">Ship Mode</div>
  <div id="stats">Kills: 0</div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
